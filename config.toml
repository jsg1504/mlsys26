[solution]
name = "kjms_gdn_decode_cute_v1"
definition = "gdn_decode_qk4_v8_d128_k_last"
author = "kjms"
description = "Standalone in-repo CuTe DSL GDN decode kernel derived from the Apache-licensed FlashInfer float32-state decode implementation, without depending on flashinfer runtime kernels."

[build]
language = "python"               # python | triton | cuda
entry_point = "main.py::run"
